<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        var uname = "John";
        function bodyload(){
            
            document.getElementById("txtName").value = uname;
            document.querySelector("p").innerHTML = `Hello ! ${uname}`;
        }
        function NameChange(){
            uname = document.getElementById("txtName").value;
            document.querySelector("p").innerHTML = `Hello ! ${uname}`;
        }
    </script>
</head>
<body onload="bodyload()">
    <input type="text" onkeyup="NameChange()" id="txtName">
    <p></p>
</body>
</html>
